# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: "local"
    hooks:
      - id: deno-fmt
        name: deno fmt
        description: Auto-format all JavaScript, TypeScript, Markdown and JSON files.
        entry: cd orw-deno && deno fmt
        types_or: [javascript, jsx, ts, tsx, json]
        pass_filenames: false
        language: system
        always_run: true
      - id: deno-lint
        name: deno lint
        description: Lint all JavaScript and TypeScript source code files.
        entry: cd orw-deno && deno lint
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
        language: system
        always_run: true
      - id: deno-check
        name: deno check
        description: Type check all JavaScript and TypeScript source code files.
        entry: cd orw-deno && deno check
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
        language: system
        always_run: true
